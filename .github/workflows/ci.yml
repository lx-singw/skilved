name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    name: Verify Web Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web lint
        run: pnpm web:lint

      - name: Typecheck canonical opportunity contracts
        run: pnpm contracts:typecheck

      - name: Test canonical opportunity contracts
        run: pnpm contracts:test

      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase emulator CLI
        run: npm install --global firebase-tools@15.22.3

      - name: Test source publication with isolated emulators
        run: pnpm catalogue:test

      - name: Run web typecheck
        run: pnpm web:typecheck

      - name: Run web build
        run: pnpm web:build
        env:
          NODE_ENV: 'production'

      - name: Run web test
        run: pnpm web:test
        env:
          NODE_ENV: 'production'
